<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로또 번호 추첨기</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --text: #1f1d1a;
    --muted: #7a746b;
    --accent: #d9432b;
    --border: #e5e0d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161a;
      --card: #222127;
      --text: #f1eee8;
      --muted: #9a958c;
      --border: #34323a;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 24px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
  }
  h1 { font-size: 1.7rem; margin-bottom: 6px; }
  .sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 28px; }

  .balls {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    min-height: 64px;
    margin-bottom: 28px;
  }
  .ball {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem; font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    box-shadow: inset -4px -6px 10px rgba(0,0,0,0.2), inset 4px 4px 8px rgba(255,255,255,0.35);
    animation: pop 0.45s cubic-bezier(.2,1.6,.4,1) both;
  }
  .ball.empty {
    background: var(--border);
    box-shadow: none;
    animation: none;
  }
  .plus { font-size: 1.6rem; font-weight: 700; color: var(--muted); }
  @keyframes pop {
    from { transform: scale(0) rotate(-180deg); opacity: 0; }
    to   { transform: scale(1) rotate(0); opacity: 1; }
  }

  /* 동행복권 공 색상 구간 */
  .c1 { background: #fbc400; }   /* 1~10 */
  .c2 { background: #69c8f2; }   /* 11~20 */
  .c3 { background: #ff7272; }   /* 21~30 */
  .c4 { background: #aaaaaa; }   /* 31~40 */
  .c5 { background: #b0d840; }   /* 41~45 */

  button {
    font: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 14px 40px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
  }
  button:hover { transform: translateY(-2px); }
  button:disabled { opacity: 0.5; cursor: default; transform: none; }

  .history { margin-top: 28px; text-align: left; }
  .history h2 {
    font-size: 0.95rem; color: var(--muted);
    margin-bottom: 10px; font-weight: 600;
  }
  .history ol { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .history li {
    display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.85rem;
  }
  .history .idx { color: var(--muted); width: 26px; }
  .history .ball { width: 28px; height: 28px; font-size: 0.8rem; animation: none; }
  .history .plus { font-size: 1rem; }
</style>
</head>
<body>
  <main class="card">
    <h1>🎱 로또 번호 추첨기</h1>
    <p class="sub">1~45 중 번호 6개 + 보너스 번호 1개</p>

    <div class="balls" id="balls"></div>

    <button id="drawBtn">번호 추첨하기</button>

    <section class="history" id="historyBox" hidden>
      <h2>추첨 기록</h2>
      <ol id="history"></ol>
    </section>
  </main>

<script>
  const ballsEl = document.getElementById('balls');
  const btn = document.getElementById('drawBtn');
  const historyBox = document.getElementById('historyBox');
  const historyEl = document.getElementById('history');
  let round = 0;

  // 번호 구간별 색상 클래스
  function colorClass(n) {
    if (n <= 10) return 'c1';
    if (n <= 20) return 'c2';
    if (n <= 30) return 'c3';
    if (n <= 40) return 'c4';
    return 'c5';
  }

  function makeBall(n) {
    const b = document.createElement('div');
    b.className = 'ball ' + colorClass(n);
    b.textContent = n;
    return b;
  }

  function makePlus() {
    const p = document.createElement('span');
    p.className = 'plus';
    p.textContent = '+';
    return p;
  }

  // 1~45 중 중복 없이 7개 추첨 (피셔-예이츠 셔플)
  function drawNumbers() {
    const pool = Array.from({ length: 45 }, (_, i) => i + 1);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    const main = pool.slice(0, 6).sort((a, b) => a - b);
    const bonus = pool[6];
    return { main, bonus };
  }

  function showEmpty() {
    ballsEl.innerHTML = '';
    for (let i = 0; i < 6; i++) {
      const e = document.createElement('div');
      e.className = 'ball empty';
      ballsEl.appendChild(e);
    }
    ballsEl.appendChild(makePlus());
    const e = document.createElement('div');
    e.className = 'ball empty';
    ballsEl.appendChild(e);
  }

  function addHistory(main, bonus) {
    round++;
    const li = document.createElement('li');
    const idx = document.createElement('span');
    idx.className = 'idx';
    idx.textContent = round + '.';
    li.appendChild(idx);
    main.forEach(n => li.appendChild(makeBall(n)));
    li.appendChild(makePlus());
    li.appendChild(makeBall(bonus));
    historyEl.prepend(li);
    historyBox.hidden = false;
  }

  btn.addEventListener('click', () => {
    btn.disabled = true;
    const { main, bonus } = drawNumbers();
    showEmpty();

    const slots = ballsEl.querySelectorAll('.ball');
    const all = [...main, bonus];

    // 공을 하나씩 순서대로 공개
    all.forEach((n, i) => {
      setTimeout(() => {
        slots[i].replaceWith(makeBall(n));
        if (i === all.length - 1) {
          addHistory(main, bonus);
          btn.disabled = false;
          btn.textContent = '다시 추첨하기';
        }
      }, 400 * (i + 1));
    });
  });

  showEmpty();
</script>
</body>
</html>
